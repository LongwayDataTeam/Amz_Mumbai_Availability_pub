name: Amz_Mumbai_Availability_Scrapper

on:
  schedule:
    - cron: '0 2-10 * * *'   # Every hour from 8 AM to 6 PM IST
  workflow_dispatch:          # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Setup SSH to access private repo
      # ==================================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # ==================================================
      # 2. Clone private scraper repo
      # ==================================================
      - name: Clone private repo
        run: |
          git clone git@github.com:LongwayDataTeam/Amz_Mumbai_Availability_pvt.git

      # ==================================================
      # 3. Setup Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # ==================================================
      # 4. Install Python dependencies
      # ==================================================
      - name: Install dependencies
        working-directory: Amz_Mumbai_Availability_pvt
        run: |
          python -m pip install --upgrade pip

          pip install \
            gspread \
            oauth2client \
            pandas \
            openpyxl \
            selenium \
            webdriver-manager \
            beautifulsoup4 \
            pytz \
            python-dotenv

      # ==================================================
      # 5. Install Google Chrome
      # ==================================================
      - name: Install Google Chrome
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            unzip \
            xvfb \
            libnss3 \
            libxss1 \
            libxi6 \
            fonts-liberation \
            libu2f-udev

          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo dpkg -i google-chrome-stable_current_amd64.deb || \
            sudo apt-get install -f -y

          echo "Chrome Installed Version:"
          google-chrome --version

      # ==================================================
      # 6. Run scraper
      # ==================================================
      - name: Run scraper
        working-directory: Amz_Mumbai_Availability_pvt
        env:
          INPUT_SPREADSHEET_ID: ${{ secrets.INPUT_SPREADSHEET_ID }}
          OUTPUT_SPREADSHEET_ID: ${{ secrets.OUTPUT_SPREADSHEET_ID }}
          INPUT_SHEET_NAME: ${{ secrets.INPUT_SHEET_NAME }}
          OUTPUT_SHEET_NAME: ${{ secrets.OUTPUT_SHEET_NAME }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python amz_mumbai_availability_pvt.py

      # ==================================================
      # 7. Upload scraper results & screenshots
      # ==================================================
      - name: Upload scraper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-mumbai-scraper-results
          path: |
            Amz_Mumbai_Availability_pvt/Amazon_Results.xlsx
            Amz_Delhi_Availability_pvt/artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 7
